version: '3.8'

services:
    server:
      build: ./server
      ports:
        - "5000:5000"
      environment:
        - AI_SERVICE_URL=http://ai-service:8000
      env_file:
        - ./server/.env
      depends_on:
        - ai-service

    ai-service:
      build: ./ai-service
      ports:
        - "8000:8000"
      env_file:
        - ./ai-service/.env

    client:
      build: ./client
      ports:
        - "5173:80"
      depends_on:
        - server